server:
  port: 8080

spring:
  application:
    name: cart-rescue-backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:cartrescue}
    username: ${POSTGRES_USER:cartrescue}
    password: ${POSTGRES_PASSWORD:cartrescue_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

ml:
  service:
    url: ${ML_SERVICE_URL:http://localhost:8000}

logging:
  level:
    com.cartrescue: INFO
